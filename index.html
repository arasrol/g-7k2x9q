@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#ECEFEE; --card:#FFFFFF; --ink:#1C2326; --muted:#6B7775;
  --line:#E1E6E4; --line2:#EEF1F0;
  --bugun:#C8893A; --diller:#5B5BD6; --fitness:#2E7D6B;
  --sage:#6A9B7A; --soft:#F6F4EF; --r:18px;
  --field:#FFFFFF; --onink:#FFFFFF; --onacc:#FFFFFF;
  --warm:#FFF5EA; --warmline:#F0D9BD; --armed:#FFF8EF; --armedline:#EAD3B2; --over:#FFEFD9; --hover:#FFF1DE;
  --okbg:#e8f1ec; --knownbg:#eef0fb; --dangerbg:#fbeae8; --simbg:#EEF0FB; --simline:#D8DDF5; --hint:#b9a88f; --hint2:#aab2b0;
  --disp:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --body:'Inter', ui-sans-serif, system-ui, sans-serif;
}
*{box-sizing:border-box;}
.app[data-theme="dark"]{ --bg:#0D1112; --card:#161B1D; --ink:#E9EFED; --muted:#8E9C99; --line:#262E31; --line2:#1D2427;
  --bugun:#E3A24E; --diller:#8F8FF2; --fitness:#4DB99B; --sage:#74B586; --soft:#1C2326;
  --field:#1C2326; --onink:#0D1112; --onacc:#10161A;
  --warm:#2B2318; --warmline:#4A3A22; --armed:#241F17; --armedline:#4A3D2A; --over:#33291A; --hover:#2E2518;
  --okbg:#1B2B22; --knownbg:#22243D; --dangerbg:#3A1F1C; --simbg:#22243D; --simline:#34385E; --hint:#7B6F5C; --hint2:#6B7775; color-scheme:dark; }
@media (prefers-color-scheme: dark){ .app[data-theme="auto"]{ --bg:#0D1112; --card:#161B1D; --ink:#E9EFED; --muted:#8E9C99; --line:#262E31; --line2:#1D2427;
  --bugun:#E3A24E; --diller:#8F8FF2; --fitness:#4DB99B; --sage:#74B586; --soft:#1C2326;
  --field:#1C2326; --onink:#0D1112; --onacc:#10161A;
  --warm:#2B2318; --warmline:#4A3A22; --armed:#241F17; --armedline:#4A3D2A; --over:#33291A; --hover:#2E2518;
  --okbg:#1B2B22; --knownbg:#22243D; --dangerbg:#3A1F1C; --simbg:#22243D; --simline:#34385E; --hint:#7B6F5C; --hint2:#6B7775; color-scheme:dark; } }
.app{-webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;}
.app button{touch-action:manipulation;}
.app{overflow-x:hidden; font-family:var(--body); color:var(--ink); background:var(--bg); min-height:100vh; min-height:100dvh; padding:28px 16px 80px;}
.wrap{max-width:920px; margin:0 auto;}

.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
.brand{font-family:var(--disp); font-weight:800; font-size:24px; letter-spacing:-.02em; display:flex; align-items:center; gap:9px;}
.brand .dot{width:11px;height:11px;border-radius:50%; background:linear-gradient(135deg,var(--bugun),var(--diller));}
.nav{display:flex; gap:5px; background:var(--card); padding:5px; border-radius:999px; border:1px solid var(--line); flex-wrap:wrap;}
.nav-btn{border:none; background:transparent; font-family:var(--body); font-weight:600; font-size:14px; color:var(--muted);
  padding:8px 13px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:7px; transition:.15s;}
.nav-btn:hover{color:var(--ink);}
.nav-btn.on.bugun{background:var(--bugun); color:var(--onacc);} .nav-btn.on.diller{background:var(--diller); color:var(--onacc);}
.nav-btn.on.fitness{background:var(--fitness); color:var(--onacc);} .nav-btn.on.vitamin{background:var(--fitness); color:var(--onacc);}
.nav-btn.on.test{background:var(--ink); color:var(--onink);}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px;}
.grid{display:grid; gap:16px;}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);}
.grid > *, .stack > *{min-width:0;}
.card{min-width:0;}
@media(max-width:680px){ .g2{grid-template-columns:minmax(0,1fr);} .topbar{justify-content:center;} }
.stack{display:flex; flex-direction:column; gap:16px;}

.eyebrow{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:0 0 4px;}
.h2{font-family:var(--disp); font-weight:700; font-size:20px; letter-spacing:-.01em; margin:0;}
.muted{color:var(--muted);}

.hero .date{font-family:var(--disp); font-weight:800; font-size:34px; letter-spacing:-.03em; line-height:1.05; margin:2px 0 8px;}
.hero .sub{color:var(--muted); font-size:15px;}
.streak{display:inline-flex; align-items:center; gap:7px; background:var(--warm); border:1px solid var(--warmline); color:var(--bugun);
  font-weight:700; font-size:13px; padding:7px 13px; border-radius:999px; margin-bottom:10px;}
.daynav{display:flex; align-items:center; gap:10px; margin:2px 0 10px; flex-wrap:wrap;}
.navbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--field);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.navbtn:hover{border-color:var(--ink);}
.backtoday{font-size:12px;font-weight:700;color:var(--bugun);background:var(--warm);border:1px solid var(--warmline);border-radius:999px;padding:6px 12px;cursor:pointer;}

.tip{display:flex; gap:11px; align-items:flex-start;}
.tip .ic{flex:none; margin-top:1px;}
.tip .t{font-size:14px; line-height:1.5;}
.summary{display:flex; flex-direction:column; gap:11px;}
.sumrow{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600;}
.sumrow b{font-variant-numeric:tabular-nums;}

.palette{display:flex; flex-wrap:wrap; gap:7px; margin:6px 0 4px;}
.block{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--field); border-radius:999px;
  padding:6px 13px; font-size:13px; font-weight:600; cursor:grab; user-select:none; transition:.12s;}
.block:hover{border-color:var(--ink);}
.block.sel{color:#fff; border-color:transparent;}
.block .dotc{width:9px;height:9px;border-radius:50%; flex:none;}
.custom-add{display:flex; gap:8px; margin:9px 0 2px;}
.selbar{display:flex; align-items:center; gap:9px; background:var(--soft); border:1px solid var(--line); border-radius:11px;
  padding:9px 13px; font-size:13px; font-weight:600; margin:11px 0 4px;}
.selbar .x{margin-left:auto; cursor:pointer; color:var(--muted); display:flex;}
.selbar .x:hover{color:var(--ink);}

.lanes{display:grid; grid-template-columns:58px 1fr; column-gap:10px; grid-auto-rows:minmax(52px,auto);}
.lane{display:contents;}
.lane .hr{display:flex; align-items:flex-start; gap:4px; width:58px; flex:none; padding-top:14px;}
.lane .drop{margin:5px 0;}
.ders-block{margin:5px 0; border-radius:13px; border:1px solid var(--line); border-left:5px solid var(--ink); padding:10px 12px;
  display:flex; flex-direction:column; gap:6px; min-height:40px;}
.ders-block .dt{font-weight:700; font-size:14px; display:flex; align-items:center; gap:7px;}
.ders-block .dm{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; opacity:.8;}
.durbar{display:flex; align-items:center; gap:6px; margin:9px 0 2px; flex-wrap:wrap;}
.durbtn{border:1px solid var(--line); background:var(--field); border-radius:9px; padding:6px 11px; font-weight:700; font-size:12px; cursor:pointer; color:var(--muted);}
.durbtn.on{background:var(--ink); color:var(--onink); border-color:var(--ink);}
.durtag{border:1px solid var(--line); background:var(--soft); border-radius:7px; padding:1px 7px; font-size:11px; font-weight:700; cursor:pointer; color:var(--muted); font-family:var(--body);}
.durtag:hover{border-color:var(--ink); color:var(--ink);}
.utask-block{border-left-width:5px; border-left-style:solid; border-radius:13px; border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  margin:5px 0; padding:10px 12px; display:flex; flex-direction:column; gap:6px; min-height:40px; cursor:grab;}
.utask-block.done .utt{opacity:.5; text-decoration:line-through;}
.utask-block .utop{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px;}
.lanes{grid-auto-rows:26px;}
.lanes .lane.hourrow .drop{border-top:1px solid var(--line);}
.lanes .lane.halfrow .drop{border-top:1px dashed var(--line2);}
.lanes .lane .drop, .lanes .lane.armed .drop{background:transparent; border-left:none; border-right:none; border-bottom:none; border-radius:0; margin:0; padding:0 8px; justify-content:flex-end;}
.lanes .lane.armed .drop{cursor:pointer;}
.lanes .lane.armed .drop:hover, .lanes .lane.over .drop{background:var(--hover);}
.lanes .lane .drop .ph{font-size:11px; color:var(--hint); padding:0;}
.lanes .hr{align-items:flex-start; padding-top:3px;}
.lanes .hr .t{font-size:12px;}
.rangebar{display:flex; align-items:center; gap:7px; margin:10px 0 4px;}
.rangebtn{border:none; background:transparent; color:var(--muted); font-family:var(--body); font-size:12px; font-weight:600; cursor:pointer; padding:4px 0;}
.rangebtn:hover{color:var(--ink);}
.rangesel{border:1px solid var(--line); border-radius:8px; padding:5px 7px; font-family:var(--body); font-size:13px; background:var(--field); color:var(--ink);}
.lanes .utask-block .utop{flex-wrap:wrap; row-gap:2px;}
.lanes .utask-block.compact .utop{flex-wrap:nowrap; width:100%;}
.lanes .hr .t.half{opacity:.45; font-weight:600; font-size:11px;}
.lanes .drop{min-height:0;}
.lanes .ders-block, .lanes .utask-block{margin:1px 0; padding:5px 10px; min-height:0; overflow:hidden; gap:3px; z-index:1;}
.lanes .ders-block.compact, .lanes .utask-block.compact{flex-direction:row; align-items:center; gap:8px; padding:0 10px;}
.lanes .ders-block.compact .dt{font-size:13px; white-space:nowrap;}
.lanes .ders-block.compact .dm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ders-block .dtasks{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
.lane .hr .t{font-variant-numeric:tabular-nums; font-weight:700; font-size:13px; color:var(--muted);}
.lane .hr .hide{opacity:.3; cursor:pointer; color:var(--muted); display:flex; transition:.12s;}
.lane:hover .hr .hide{opacity:1;}
.lane .drop{flex:1; min-height:40px; border:1.5px dashed transparent; border-radius:13px; padding:6px;
  display:flex; flex-wrap:wrap; gap:6px; align-content:center; background:var(--line2);}
.lane.armed .drop{background:var(--armed); border-color:var(--armedline); cursor:pointer;}
.lane.over .drop{background:var(--over); border-color:var(--bugun);}
.lane .ph{color:var(--hint2); font-size:12px; padding-left:4px;}

.chip{display:inline-flex; align-items:center; gap:8px; border-radius:10px; padding:6px 9px;
  font-size:13px; font-weight:600; cursor:grab; background:var(--field); border:1px solid var(--line); border-left:4px solid var(--ink);}
.chip.done{opacity:.5; text-decoration:line-through;}
.chip.ders{cursor:default; opacity:1; border-style:solid;}
.chip.ders .ders-kind{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; opacity:.75;}
.chip.ders .ders-loc{font-size:11px; opacity:.65; margin-left:2px;}
.ders-span{display:flex; flex-direction:column; gap:1px;}
.chip .tg, .utask-block .tg{width:18px;height:18px;border-radius:50%; border:1.6px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; flex:none;}
.chip .tg.on, .utask-block .tg.on{background:var(--sage); border-color:var(--sage);}
.chip .rm, .utask-block .rm{cursor:pointer; color:var(--muted); display:flex;}
.chip .rm:hover{color:#c0392b;}
.showall{margin-top:12px;}

.chk{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--line); background:var(--field); cursor:pointer; flex:none;
  display:flex; align-items:center; justify-content:center; color:#fff; transition:.12s;}
.chk.done{background:var(--sage); border-color:var(--sage);}
.row{display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--line2);}
.row:last-of-type{border-bottom:none;}
.row .txt.done{text-decoration:line-through; color:var(--muted);}
.iconbtn{border:none;background:transparent;color:var(--muted);cursor:pointer; padding:4px; border-radius:7px; display:flex;}
.iconbtn:hover{color:#c0392b; background:var(--dangerbg);}
